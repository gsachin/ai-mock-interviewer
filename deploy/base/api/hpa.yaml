apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: management-api
    app.kubernetes.io/part-of: mock-interviewer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # The floor is 2, not 1: a single-replica API means every rollout, node drain
  # and OOM is a visible outage, and the API is the tier that serves the static
  # UI and the token endpoint — the two things that must keep working while
  # everything else is having a bad day (BRD-01).
  #
  # Note this is also why overlays/local has to lower BOTH this floor and the
  # Deployment's replicas: patching only the Deployment leaves the HPA free to
  # pull the count back to 2.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # CPU is a fair proxy for this tier: short, uniform requests, no long-lived
    # connections held open in the process (US-008's pooling makes sure of that).
    # The worker is the tier where CPU is the wrong signal, which is why it uses
    # KEDA on queue depth instead (BRD-07) — and why there is no ScaledObject
    # anywhere on this Deployment: two controllers writing spec.replicas is a
    # conflict, not redundancy (NFR-2).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # 5 minutes of quiet before shedding a replica. The API is stateless and
      # cheap to restart, but it is also the thing every candidate's browser is
      # holding a WebSocket upgrade against; flapping replicas under a
      # spiky-but-tiny load pattern is how a "responsive" cluster feels slow.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Symmetric on purpose: 2 pods per minute is enough to absorb a
      # step change, and it keeps the scale-up from outrunning the readiness of
      # whatever it depends on.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
