apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/name: rag
    app.kubernetes.io/component: rag
    app.kubernetes.io/part-of: mock-interviewer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag
  # Floor 2 for the same reason as the API: with maxUnavailable: 0 and a
  # single replica, every rollout is a full retrieval outage for its duration.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # CPU is a fair signal for this tier specifically because its work is short
    # and uniform (200-360 ms per retrieval, per MOD-13) — the signal is
    # proportional to load rather than to how unlucky one request was.
    #
    # The ceiling is where the real limit lives, and it is not CPU: multi-replica
    # is safe only because Qdrant and Elasticsearch are shared services with
    # their own connection limits (DG-03). Raising maxReplicas without checking
    # those limits just moves the queue one hop downstream.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Retrieval benefits disproportionately from a warm cache and warm
      # connections; 5 minutes stops the tier shedding a replica during the gap
      # between two candidates and paying to rebuild all of it.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
