apiVersion: v1
kind: Service
metadata:
  name: rag
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/name: rag
    app.kubernetes.io/component: rag
    app.kubernetes.io/part-of: mock-interviewer
spec:
  # The name is load-bearing: RAG_MCP_URL is http://rag:8031/mcp, in the base
  # ConfigMap and in docker-compose.yml alike, so the laptop and the cluster
  # differ by hostname suffix and nothing else.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag
  ports:
    - name: http
      port: 8031
      targetPort: http
      protocol: TCP
