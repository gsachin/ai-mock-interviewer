apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/part-of: mock-interviewer
type: Opaque
stringData:
  # ONE Secret, consumed by BOTH sides of the same handshake:
  #   the API signs the candidate's video grant with it, and the SFU validates
  #   the JWT it receives with it.
  #
  # That is the whole point of it being one object. Two Secrets, or a value
  # edited in one place and not the other, does not fail loudly: the API
  # generates a perfectly valid JWT that the SFU rejects, and the browser shows
  # an opaque "invalid token" while both services report healthy. Rotation means
  # replacing this object once (UC-08), never editing a key in two places.
  #
  # REPLACE_ME is not a default. The app asserts these are present and exits at
  # boot with a named error if they are missing; it must never fall back to
  # devkey/secret in a cluster, because an opaque mid-interview token failure is
  # far worse than a pod that refuses to start. The only place devkey/secret is
  # legitimate is overlays/local, which is where they live.
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME"

  # The SFU reads its whole key list from LIVEKIT_KEYS as "key: secret" (quoted,
  # because the value contains a colon). It holds the SAME pair as the two keys
  # above rather than a second credential — it exists because the livekit image
  # is distroless (no shell) and cannot compose the string at runtime from the
  # two halves. Edit all three together; a mismatch is the failure described
  # above, arriving at the SFU instead of the API.
  LIVEKIT_KEYS: "REPLACE_ME: REPLACE_ME"
