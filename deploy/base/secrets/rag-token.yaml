apiVersion: v1
kind: Secret
metadata:
  name: rag-token
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/part-of: mock-interviewer
type: Opaque
stringData:
  # OIDC bearer presented by our services to the RAG MCP service, scope
  # rag:retrieve (RAG_MCP_TOKEN in interviewer/config.py).
  #
  # An EMPTY value is meaningful, not a mistake: it selects none-auth mode, in
  # which every request runs as the RAG service's default tenant. That is what
  # the local overlay sets, because the local RAG service runs with
  # RAG_CORE_AUTH_MODE=none.
  #
  # REPLACE_ME is a deliberate sentinel rather than an empty string: in OIDC
  # mode a wrong token fails at the first retrieval (loud, one request, an
  # obvious cause) whereas a missing one can look like a configuration choice.
  RAG_MCP_TOKEN: "REPLACE_ME"
