# ════════════════════════════════════════════════════════════════════════════
#  DOCUMENTATION ONLY — THIS FILE IS NEVER APPLIED.
#
#  It is NOT in base/kustomization.yaml's resources list, which is the whole
#  mechanism: it cannot be applied by accident, by `kubectl apply -k` or by a
#  script that globs the directory.
#
#  Its purpose (BRD-12 / NFR-11) is to make the required key SHAPE reviewable in
#  a pull request without any actual value existing anywhere in the repository.
#  A reviewer reading a Secret change can compare it against this file; a
#  reviewer reading THIS file learns what an environment must supply.
#
#  The live objects are:
#      livekit-keys  →  secrets/livekit-keys.yaml
#      rag-token     →  secrets/rag-token.yaml
#
#  Any key added to either of those must be added here in the same commit, or
#  the example stops being a contract and becomes archaeology.
#
#  Cloud overlays do not extend this file: they replace the whole mechanism with
#  External Secrets bound to the environment's own secret manager (US-019). The
#  keys are identical, which is why this shape is worth pinning.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: mock-interviewer-secrets-example
  namespace: mock-interviewer
type: Opaque
stringData:
  # ── required ─────────────────────────────────────────────────────────────
  LIVEKIT_API_KEY: "<livekit api key>"
  LIVEKIT_API_SECRET: "<livekit api secret — must pair with the key above and match the SFU>"
  LIVEKIT_KEYS: "<key>: <secret> — the SFU's encoding of the same pair"
  RAG_MCP_TOKEN: "<oidc bearer, scope rag:retrieve — empty string selects none-auth>"

  # ── optional: only if the corresponding provider is selected ─────────────
  # Names are from interviewer/config.py. A hosted STT/TTS provider is a config
  # flip (INTERVIEW_STT_PROVIDER / INTERVIEW_TTS_PROVIDER), and these are the
  # credentials that flip needs.
  INTERVIEW_DEEPGRAM_API_KEY: "<only if INTERVIEW_STT_PROVIDER=deepgram>"
  INTERVIEW_CARTESIA_API_KEY: "<only if INTERVIEW_TTS_PROVIDER=cartesia>"
  INTERVIEW_ELEVENLABS_API_KEY: "<only if INTERVIEW_TTS_PROVIDER=elevenlabs>"
