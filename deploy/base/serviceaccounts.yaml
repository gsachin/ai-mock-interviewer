# One ServiceAccount per workload, with the token OFF (NFR-8).
#
# Our pods need ZERO Kubernetes API access: they read config from ConfigMaps and
# Secrets injected as files/env by the kubelet, and they never list, watch or
# patch anything. Not mounting a token removes an entire lateral-movement path
# at no cost, which is why it is set in both places — on the ServiceAccount
# (so it is the default for anything that uses it) and on the pod spec (so a
# pod that forgets the ServiceAccount still does not get a token).
#
# The ServiceAccounts exist rather than the namespace `default` being reused so
# that granting an RBAC role later is a deliberate, reviewable act against a
# named identity, not a silent change to every pod in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/part-of: mock-interviewer
automountServiceAccountToken: false
