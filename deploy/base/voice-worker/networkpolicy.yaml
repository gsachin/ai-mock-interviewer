# CORRECTION, and this comment previously said the opposite: **kindnet DOES
# enforce NetworkPolicy** on kind v0.33.0 / k8s v1.37.0. The old text claimed
# these rules were "syntax-checked locally and nothing more", which is wrong
# in the most expensive possible direction — it invites reading a green local
# run as proof of a network posture that is actually being enforced.
#
# The evidence was a TCP TIMEOUT to a port `netstat` showed as LISTENing: a
# drop, not a refusal. Two real outages were hidden behind the old assumption
# (an unreachable SFU, then an unreachable session store), and a third
# surfaced while adding the rules below — NetworkPolicy is BIDIRECTIONAL, so
# an egress rule without its matching ingress rule looks correct in isolation
# and drops packets at runtime.
---
# ── Ingress: control plane only ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-worker-ingress
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/part-of: mock-interviewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: voice-worker
  policyTypes:
    - Ingress
  ingress:
    # Nothing. Not an oversight: the worker has no inbound application traffic
    # (it dials the SFU and receives jobs over that connection), so the only
    # ingress it legitimately has is the kubelet's probes and Prometheus's
    # scrape — both granted namespace-wide in base/networkpolicy.yaml.
    #
    # Writing the empty rule set explicitly is the point of this object:
    # `policyTypes: [Ingress]` with no rules denies everything else that is not
    # allowed namespace-wide, including a stray cluster-internal caller.
    []
---
# ── Egress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-worker-egress
  namespace: mock-interviewer
  labels:
    app.kubernetes.io/part-of: mock-interviewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: voice-worker
  policyTypes:
    - Egress
  egress:
    # The management API -- and ONLY for the in-cluster end-to-end smoke test.
    #
    # This rule's absence was the actual blocker for a long debugging session,
    # and the reason is worth recording because the mistake was asymmetric:
    # NetworkPolicy is BIDIRECTIONAL. An ingress rule on `api` was added and
    # verified correct, but the packet was dropped by THIS policy on the way
    # out, before the API's rules were ever consulted. Deleting and recreating
    # the api policy changed nothing because the wrong half was being fixed.
    #
    # `kubectl get netpol api-ingress` looked right the whole time. The
    # diagnostic that actually found it was listing the worker's EGRESS rules
    # and noticing `api` was not among them -- not inspecting the policy that
    # appeared to be failing.
    #
    # scripts/e2e_voice_client.py needs livekit-rtc and a working TTS engine to
    # synthesise candidate answers, and the worker image is the one pod here
    # that carries both. It cannot run from outside the cluster either, since
    # /voice/token returns the in-cluster LIVEKIT_URL.
    #
    # A test affordance, not a production requirement: the worker does not
    # otherwise call the API. When US-020's CI e2e job lands, scope this to a
    # dedicated test ServiceAccount rather than the worker's whole lifetime.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8010
          protocol: TCP
    # The Docker Desktop host gateway, for GPU inference services running on
    # the HOST rather than in the cluster.
    #
    # WHY THE HOST AND NOT A POD: kind nodes are Docker containers created
    # without `--gpus`, so they cannot see the GPU at all -- even though plain
    # containers can (`docker run --gpus all` reports the RTX 5060 Ti). Nested
    # GPU passthrough through Docker Desktop's WSL2 layer is not something to
    # build a dev loop on.
    #
    # So the GPU tier lives beside the cluster, not in it, and pods reach it
    # over the host gateway. That is the same shape as production, where the
    # GPU node pool is a separate tier -- the difference is only which side of
    # the boundary the hardware sits on.
    #
    # 192.168.65.254 is Docker Desktop's host gateway. On Linux or a
    # different runtime, replace it with that platform's gateway address
    # (the local overlay patches this).
    - to:
        - ipBlock:
            cidr: 192.168.65.254/32
      ports:
        - port: 11434
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 8880
          protocol: TCP
    # ── The SFU, including the media ports ──────────────────────────────────
    # 7880 is the signalling API (WebSocket + Twirp) and it is the port the
    # worker's LIVEKIT_URL names, so it is the one everybody remembers.
    # 7881/TCP and 7882/UDP are the MEDIA path, and omitting them produces an
    # interview with no audio — the same class of failure as an ingress that
    # buffers WebSocket frames (NFR-9): both sides look healthy, every
    # application-level check passes, and the candidate hears nothing. If you
    # ever add a TURN or TCP-fallback port, this is the rule to extend.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livekit
      ports:
        - port: 7880
          protocol: TCP
        - port: 7881
          protocol: TCP
        - port: 7882
          protocol: UDP
    # ── Session state ───────────────────────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sessions
      ports:
        - port: 6379
          protocol: TCP
    # ── Retrieval: banks, rubrics, follow-ups ───────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rag
      ports:
        - port: 8031
          protocol: TCP
    # ── Engines: LLM, STT, TTS ──────────────────────────────────────────────
    # Selected by the COMPONENT label, not by pod name, and this is the one
    # rule here that is deliberately not a list of services. The engine choice
    # is a configuration decision (engine-endpoints.yaml): local runs
    # ollama/stt/tts, production runs vllm-voice/whisper/kokoro, and both sets
    # carry `app.kubernetes.io/component: engine`. A policy that had to be
    # edited whenever that choice changed would be a landmine sitting directly
    # under the product's core feature.
    #
    # The port list is the union of both sets (11434 ollama, 8000 the OpenAI
    # -compatible STT/LLM servers, 8880 Kokoro) and is intentionally wider than
    # any one deployment needs.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: engine
      ports:
        - port: 11434
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 8880
          protocol: TCP
    # DNS last, and never omitted: every rule above is an IP match, but the app
    # dials by name. Without this the whole file is a very convincing outage.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
