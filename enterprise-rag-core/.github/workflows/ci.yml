name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # conftest probes this host:port; the Redis Stack container below
      # publishes it. Where no Docker engine exists (GitHub Windows runners
      # don't support service containers), the redis-marked tests auto-skip.
      REDIS_STACK_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Redis Stack
        shell: bash    # Git Bash ships on GitHub Windows runners; bash's ||
                       # semantics are the same everywhere (pwsh behaves
                       # differently with native-command failures).
        run: docker run -d --name rag-redis-stack -p 6379:6379 redis/redis-stack-server:latest || echo "Redis Stack unavailable - redis-marked tests will skip"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
