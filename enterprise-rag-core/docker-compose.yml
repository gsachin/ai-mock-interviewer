# Optional infrastructure for the enterprise-rag-core backend matrix:
#   RAG_CORE_VECTOR_BACKEND=qdrant          -> qdrant:6333
#   RAG_CORE_KEYWORD_BACKEND=elasticsearch  -> elasticsearch:9200
#   RAG_CORE_CACHE_BACKEND=redisvl          -> redis-stack:6379
#   OLLAMA_URL=http://localhost:11434       -> ollama (pull nomic-embed-text)
# Images follow the SDK pins in the design doc (qdrant-client 1.19.x,
# elasticsearch 9.5.x, redisvl 0.26.x on Redis Stack, ollama embeddings).
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis-stack:
    # Redis Stack required — plain Redis OSS cannot run the RedisVL cache
    # (needs RediSearch + RedisJSON).
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull nomic-embed-text; wait"]

volumes:
  qdrant_data:
  es_data:
  redis_data:
  ollama_data:
