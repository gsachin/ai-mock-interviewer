[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-interviewer"
version = "0.1.0"
description = "Real-time web-based AI technical mock interviewer (voice chat) — MCP consumer of the standalone enterprise-rag-core service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "AI Work" }]

# Core deps stay minimal: the MCP SDK client + httpx. The RAG service itself
# is a separate deployment — this package never imports enterprise-rag-core.
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "mcp>=2.1.1,<3",          # matches the core service's pinned SDK (2.1.1)
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "python-multipart>=0.0.18",   # POST /skills multipart upload (Skill Update page)
    # The session store is a runtime dependency of the management plane now
    # that sessions live in Redis (US-004), not in a process-local dict.
    # It previously sat only in [dev] because nothing on the serving path
    # imported it -- so the image built, started, passed its probes, and then
    # failed on the FIRST request with "No module named 'redis'" and a 500.
    # RedisSessionStore imports it lazily, which is why the app still runs on
    # the `memory` default without this; a redis-configured deployment needs it.
    "redis>=7.4,<8",
    # POST /voice/token mints a LiveKit JWT, so the API's serving path needs
    # this. It sat only in [voice] -- which pulls in livekit-agents and the
    # whole engine stack -- because the endpoint was written alongside the
    # voice worker and never considered a management-plane dependency.
    #
    # The failure was a 503 with a correct-looking body on an otherwise healthy
    # pod: keys set, probes green, connection fine. FIFTH defect of the
    # "a dependency declared somewhere other than where it is used" family,
    # and the reason that family deserves a mechanical check rather than care.
    #
    # livekit-api is a small JWT/AccessToken helper, NOT livekit-agents -- the
    # API image stays lean (287MB) by taking this alone.
    "livekit-api>=1,<2",
]
web = [
    "streamlit>=1.40",        # web/streamlit_app.py — interactive text-mode interview UI
]
s3 = [
    # INTERVIEW_BANK_STORE=s3 only. Imported lazily by S3BankStore, exactly as
    # RedisSessionStore lazily imports redis, so the package stays importable
    # and fully functional on the local/memory path without this installed.
    "aioboto3>=13,<16",
]
voice = [
    # Pinned to a MINOR, not `>=1`. worker.py reads server.draining and wraps
    # server._is_available -- private API. A floating constraint that renames
    # one of those turns a diagnostic into an import-time crash (REC-06).
    "livekit-agents>=1.8,<1.9",
    "livekit-api>=1",         # AccessToken for the /voice/token endpoint
    "livekit-plugins-silero>=1",  # silero VAD
    "faster-whisper>=1.1",    # self-hosted STT (CTranslate2, lazy model load)
    "kokoro-onnx>=0.2",       # self-hosted natural TTS (no espeak-ng/torch needed)
    "numpy>=2",               # audio format conversion (48k s16le frames)
    # PyAV version is platform-conditional.
    # Windows: PyAV >= 13 is blocked by Smart App Control on some machines
    # (unsigned DLLs, "An Application Control policy has blocked this file");
    # 12.3.0 loads clean, and livekit-agents only needs av for its codec
    # utils, which the interviewer pipeline never exercises.
    # Everywhere else that policy does not exist, so take a current release.
    "av==12.3.0; sys_platform == 'win32'",
    "av>=13,<16; sys_platform != 'win32'",
]
dev = [
    "pytest>=8",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "redis>=7.4,<8",        # session store (live-tested when Redis is reachable)
]

[tool.setuptools.packages.find]
include = ["interviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration against a running enterprise-rag-core MCP server (set RAG_MCP_URL)",
]
